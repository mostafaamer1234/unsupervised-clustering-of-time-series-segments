name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests
      - name: Benchmark vs baselines (results in job summary)
        run: python benchmarks/compare_baselines.py >> "$GITHUB_STEP_SUMMARY"
